<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>RawAnalytics</title>
    <style type="text/css">
        fieldset { border: 1px solid #ddd; margin: 0 0 1.1em 0; padding: 0 1.1em 1.1em 1.1em; }
        legend { font-size: 1.0em; font-weight: bold; }
        input[type="text"], input[type="password"] { -moz-background-clip: padding; -moz-border-radius: 5px; -moz-box-shadow: 0 0 3px #ffffff inset, 0 1px 1px rgba(0, 0, 0, 0.1); -webkit-background-clip: padding-box; -webkit-border-radius: 5px; -webkit-box-shadow: 0 0 3px #ffffff inset, 0 1px 1px rgba(0, 0, 0, 0.1); background-clip: padding-box; background-image: linear-gradient(top, #ffffff 20%, #f6f6f6 50%, #eeeeee 52%, #f4f4f4 100%); background-image: -webkit-linear-gradient(top, #ffffff 20%, #f6f6f6 50%, #eeeeee 52%, #f4f4f4 100%); background-image: -moz-linear-gradient(top, #ffffff 20%, #f6f6f6 50%, #eeeeee 52%, #f4f4f4 100%); background-image: -o-linear-gradient(top, #ffffff 20%, #f6f6f6 50%, #eeeeee 52%, #f4f4f4 100%); background-image: -ms-linear-gradient(top, #ffffff 20%, #f6f6f6 50%, #eeeeee 52%, #f4f4f4 100%); background-image: linear-gradient(top, #ffffff 20%, #f6f6f6 50%, #eeeeee 52%, #f4f4f4 100%); border: 1px solid #aaaaaa; border-radius: 5px; box-shadow: 0 0 3px #ffffff inset, 0 1px 1px rgba(0, 0, 0, 0.1); color: #444444; display: inline; filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#ffffff', endColorstr='#eeeeee', GradientType=0); height: 23px; line-height: 24px; overflow: hidden; padding: 0 0 0 8px; position: relative; white-space: nowrap; width: 100px; }
        textarea { min-height: 75px; width: 1113px; }
        select { border: 1px solid #ccc; color: #444; font-size: 1.1em; padding: 1px; }
        .infotable { font-family: 'Cantarell' , arial, serif; }
        .infotable table { border: 1px solid #DDDDDD; border-collapse: collapse; }
        .infotable td { padding: 5px; border: 1px solid #DDDDDD; border-collapse: collapse; }
    </style>
    <link href="/Content/themes/Ucms/google-like-buttons.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <fieldset>
        <legend>Raw Analytics between Dates</legend>
        <p class="buttons">
            <button id="authorize-button" class="ibutton">
                Authorize</button>
        </p>
        <div class="editor-label" style="visibility: hidden">
            Table Id:
        </div>
        <div class="editor-field" style="visibility: hidden">
            <input type="text" id="table-id" />
            <p class="note">
                Format is ga:xxx where xxx is your profile ID.</p>
        </div>
        <div class="editor-label">
            Start Date:
        </div>
        <div class="editor-field">
            <input type="text" id="start-date" />
        </div>
        <div class="editor-label">
            End Date:
        </div>
        <div class="editor-field">
            <input type="text" id="end-date" />
        </div>
        <p class="buttons">
            <button id="run-demo-button" class="ibutton" style="visibility: hidden">
                Run Demo</button>
        </p>
    </fieldset>
    <div id="output">
        Loading, one sec....</div>
    <hr />
    <script src="http://ajax.aspnetcdn.com/ajax/jquery/jquery-1.8.0.min.js" type="text/javascript"></script>
    <script src="auth_util.js" type="text/javascript"></script>
    <script src="core_reporting_api_v3_reference.js" type="text/javascript"></script>
    <script src="https://apis.google.com/js/client.js?onload=handleClientLoad" type="text/javascript"></script>
</body>
</html>
